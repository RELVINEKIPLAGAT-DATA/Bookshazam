<!DOCTYPE html>
<html>
<head>
<title>BookShazam - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>📚 BookShazam</h1>
  <p>Shazam for Books - KYU Project by Relvine</p>
  
  <input type="email" id="email" placeholder="Enter your email e.g. relvine@kyu.ac.ke">
  <input type="password" id="password" placeholder="Enter password">
  
  <button onclick="login()">Log In</button>
  <button onclick="signup()" class="secondary">Create New Account</button>
  
  <p id="message"></p>
</div>
<script src="app.js"></script>
</body>
</html>
